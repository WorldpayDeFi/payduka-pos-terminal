services:
  # API (always-on; free web services sleep after inactivity)
  - type: web
    name: payduka-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: payduka-db
          property: connectionString
      # Variable names must match lib/integrations-openai-ai-server (confirm once I see that file)
      - key: OPENAI_API_KEY
        sync: false

  # PoS frontend (static, served from Render's CDN)
  - type: web
    name: payduka-pos
    runtime: static
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/pos-terminal run build
    staticPublishPath: artifacts/pos-terminal/dist/public
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://payduka-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: payduka-db
    plan: basic-256mb
